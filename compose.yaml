name: gorizont
services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "127.0.0.1:${CLICKHOUSE_NATIVE_PORT:-9000}:9000"
    environment:
      CLICKHOUSE_DB: gorizont
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8123/ping | grep -q Ok"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    mem_limit: 2g
    security_opt:
      - no-new-privileges:true

  studio:
    image: gorizont-studio:0.3.0
    build: .
    restart: unless-stopped
    depends_on:
      clickhouse:
        condition: service_healthy
    ports:
      - "127.0.0.1:${STUDIO_PORT:-4180}:4173"
    environment:
      PUBLIC_ORIGIN: "http://127.0.0.1:${STUDIO_PORT:-4180}"
      BILLING_ENABLED: "${BILLING_ENABLED:-false}"
      PAYMENT_DRIVER: "${PAYMENT_DRIVER:-stub}"
      AUTH_DEMO_SEED: "${AUTH_DEMO_SEED:-false}"
      CLICKHOUSE_ENABLED: "true"
      CLICKHOUSE_URL: "http://clickhouse:8123"
      CLICKHOUSE_USER: "${CLICKHOUSE_USER:-default}"
      CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD:-}"
      CLICKHOUSE_DATABASE: gorizont
      TRANSCRIBE_BACKEND: "${TRANSCRIBE_BACKEND:-auto}"
    volumes:
      - media_temp:/app/.local-media
      - billing_data:/app/.local-billing
      - auth_data:/app/.local-auth
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    cpus: 2
    pids_limit: 128
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  gpu-check:
    image: nvidia/cuda:12.4.1-base-ubuntu22.04
    profiles: [gpu-check]
    command: [nvidia-smi]
    network_mode: none
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # GigaAM path smoke for acceptance GPU RTX 3060 Ti 16 GB.
  # Does not start the Gorizont UI or billing. See docs/GPU_PROBE.md.
  gpu-probe:
    image: gorizont-gpu-probe:0.2.0
    build:
      context: ./worker
      dockerfile: Dockerfile.gpu-probe
    profiles: [gpu-probe]
    environment:
      GIGAAM_MODEL: ${GIGAAM_MODEL:-v3_e2e_rnnt}
      GIGAAM_PYTORCH_MODEL_DIR: /data/models/gigaam
      HF_HOME: /data/models/huggingface
      TORCH_HOME: /data/models/torch
      HOME: /data/runtime-home
    volumes:
      - gpu_probe_data:/data
    security_opt:
      - no-new-privileges:true
    mem_limit: 8g
    pids_limit: 256
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  media_temp:
  billing_data:
  auth_data:
  clickhouse_data:
  gpu_probe_data:
