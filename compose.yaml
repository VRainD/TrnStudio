name: gorizont
services:
  studio:
    image: gorizont-studio:0.2.0
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:${STUDIO_PORT:-4180}:4173"
    environment:
      PUBLIC_ORIGIN: "http://127.0.0.1:${STUDIO_PORT:-4180}"
    volumes:
      - media_temp:/app/.local-media
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    cpus: 2
    pids_limit: 128
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  gpu-check:
    image: nvidia/cuda:12.4.1-base-ubuntu22.04
    profiles: [gpu-check]
    command: [nvidia-smi]
    network_mode: none
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
volumes:
  media_temp:
