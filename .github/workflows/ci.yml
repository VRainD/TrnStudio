name: Studio checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Browser checks
        run: |
          node tools/preview.mjs > /tmp/studio.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/healthz && break || sleep 1; done
          npm run test:ui
      - run: docker compose config --quiet
      - run: docker compose build studio
      - name: Container smoke test
        run: |
          docker compose up -d --wait studio
          curl --fail http://127.0.0.1:4180/healthz
      - if: always()
        run: docker compose down
